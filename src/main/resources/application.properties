spring.application.name=picoplay
server.port=8080

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/picoplay_db
spring.datasource.username=postgres
spring.datasource.password=picoplay123

# JPA / Hibernate (crea y actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect